name: Validate red-team repair branch
on:
  push:
    branches: [repair/redteam-20260916]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redteam-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair-and-verify:
    if: github.ref == 'refs/heads/repair/redteam-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/redteam-20260916
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply checksum-verified source repair
        shell: bash
        run: |
          set -euo pipefail
          if test -f .maintenance/patch1.b64; then
            python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = [Path(f'.maintenance/patch{i}.b64') for i in range(1,5)]
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '0a9b60ead8a768a6a457e608ca93a3f9f0fd447a87433826166aef25b7d1f433', 'Source patch checksum mismatch'
          Path('/tmp/portfolio-repair.diff').write_bytes(lzma.decompress(packed))
          PY
            git apply --check /tmp/portfolio-repair.diff
            git apply /tmp/portfolio-repair.diff
            rm .maintenance/patch{1,2,3,4}.b64
          fi
          # Playwright Python spells this option java_script_enabled.
          sed -i 's/javascript_enabled=/java_script_enabled=/g' tools/browser_check.py
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Generate shared metadata and small previews
        run: python tools/sync_site.py
      - name: Static and content-preservation gates
        run: python tools/check_site.py
      - name: Chromium regression with real images
        env:
          BROWSER: chromium
        run: python tools/browser_check.py
      - name: WebKit regression with real images
        env:
          BROWSER: webkit
        run: python tools/browser_check.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redteam-validation
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
      - name: Commit validated files to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_site.py --check
          git diff --exit-code -- llms.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve portfolio red-team findings with verified three-language output'
            git push origin HEAD:refs/heads/repair/redteam-20260916
          fi
          echo "Validated repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
