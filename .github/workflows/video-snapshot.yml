name: Video layout source snapshot
on:
  push:
    branches: [repair/video-aspect-20260918]
    paths: [.github/workflows/video-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect actual source and video posters without fonts
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          root=pathlib.Path('.')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/video-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  path=root/name
                  if path.suffix.lower() in ('.woff','.woff2','.ttf','.otf','.eot') or '/fonts/' in name: continue
                  if name.startswith('assets/img/') and 'video' not in path.name: continue
                  if path.is_file(): z.write(path,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-source-fixture
          path: /tmp/video-source.zip
          retention-days: 2
