name: Site quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Static and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned dependencies and browsers
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Static, schema, links, image and content gates
        run: python tools/check_site.py
      - name: Chromium regression
        env:
          BROWSER: chromium
        run: |
          python tools/browser_check.py
          python tools/video_preview_check.py
      - name: WebKit regression
        env:
          BROWSER: webkit
        run: |
          python tools/browser_check.py
          python tools/video_preview_check.py
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-quality-${{ github.sha }}
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
  verify-published:
    name: Verify published bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - name: GET deployed content, assets, llms and HTTP status
        run: python tools/verify_live.py
      - name: Save live verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-verification-${{ github.sha }}
          path: .test-results/live.json
          include-hidden-files: true
          retention-days: 14
