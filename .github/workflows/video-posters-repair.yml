name: Repair native video previews
on:
  push:
    branches: [repair/video-aspect-20260918]
    paths:
      - .github/workflows/video-posters-repair.yml
      - .maintenance/fix_instagram_posters.py
      - tools/video_preview_check.py
permissions:
  contents: read
concurrency:
  group: native-video-preview-repair
  cancel-in-progress: true
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/video-aspect-20260918
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned dependencies and browsers
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Fetch original public posters and apply guarded repair
        run: |
          python .maintenance/fix_instagram_posters.py
          python tools/sync_site.py
          python tools/check_site.py
          git diff --exit-code -- llms.txt
          git diff --no-ext-diff > .test-results/final-video-repair.diff
      - name: Verify actual poster ratios and whole-site behavior in both engines
        shell: bash
        run: |
          set -euo pipefail
          (BROWSER=chromium python tools/video_preview_check.py && BROWSER=chromium python tools/browser_check.py) > .test-results/final-chromium.log 2>&1 &
          chromium_pid=$!
          (BROWSER=webkit python tools/video_preview_check.py && BROWSER=webkit python tools/browser_check.py) > .test-results/final-webkit.log 2>&1 &
          webkit_pid=$!
          failed=0
          wait "$chromium_pid" || failed=1
          wait "$webkit_pid" || failed=1
          cat .test-results/final-chromium.log
          cat .test-results/final-webkit.log
          exit "$failed"
      - name: Commit validated files to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_site.py --check
          git diff --exit-code -- llms.txt
          rm -f .maintenance/fix_instagram_posters.py .maintenance/repair_video_aspect.py tools/video_layout_check.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve native Instagram thumbnail ratios and responsive YouTube previews'
          git push origin HEAD:refs/heads/repair/video-aspect-20260918
          git rev-parse HEAD | tee .test-results/validated-commit.txt
          echo "Validated repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect changed source and native posters for visual review
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd(); out=root/'.test-results'; out.mkdir(exist_ok=True)
          files=list(root.rglob('index.html'))
          files += list((root/'assets/img/instagram').glob('*.jpg'))
          files += [root/p for p in ('assets/css/site.css','assets/js/main.js','site-data/content-baseline.json','site-data/instagram-posters.json','tools/video_preview_check.py')]
          with zipfile.ZipFile(out/'final-video-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  if path.is_file() and not any(p.startswith('.') for p in path.relative_to(root).parts): archive.write(path,path.relative_to(root))
          PY
      - name: Save validation and screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-video-preview-validation
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
