name: Validate responsive video repair
on:
  push:
    branches: [repair/video-aspect-20260918]
permissions:
  contents: read
concurrency:
  group: video-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair-and-test:
    if: github.ref == 'refs/heads/repair/video-aspect-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/video-aspect-20260918
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned browser dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Record original video geometry and screenshots
        env:
          VIDEO_PHASE: before
        run: python tools/video_layout_check.py
      - name: Apply narrowly scoped, content-preserving repair
        run: |
          python .maintenance/repair_video_aspect.py
          python tools/sync_site.py
          python tools/check_site.py
          git diff --exit-code -- llms.txt
          git diff --no-ext-diff > .test-results/video-repair.diff
      - name: Chromium and WebKit regressions
        shell: bash
        run: |
          set -euo pipefail
          (BROWSER=chromium python tools/video_layout_check.py && BROWSER=chromium python tools/browser_check.py) > .test-results/chromium-validation.log 2>&1 &
          chromium_pid=$!
          (BROWSER=webkit python tools/video_layout_check.py && BROWSER=webkit python tools/browser_check.py) > .test-results/webkit-validation.log 2>&1 &
          webkit_pid=$!
          failed=0
          wait "$chromium_pid" || failed=1
          wait "$webkit_pid" || failed=1
          cat .test-results/chromium-validation.log
          cat .test-results/webkit-validation.log
          exit "$failed"
      - name: Record real Instagram rendering separately from deterministic tests
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import functools, http.server, json, threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root = Path.cwd()
          out = root / '.test-results'
          out.mkdir(exist_ok=True)
          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), functools.partial(Handler, directory=str(root)))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          report = {'playback_tested': False, 'cases': []}
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for width in (390, 1280):
                  ctx = browser.new_context(viewport={'width':width,'height':900}, reduced_motion='reduce')
                  page = ctx.new_page()
                  for slug in ('answer-keelung-2025', 'seikai-tokyo-2026'):
                      record = {'page':slug,'width':width,'requests':[]}
                      def response_seen(response):
                          if 'instagram.com' in response.url and ('embed' in response.url):
                              record['requests'].append({'url':response.url,'status':response.status})
                      page.on('response', response_seen)
                      try:
                          page.goto(f'http://127.0.0.1:{server.server_port}/exhibitions/{slug}/',wait_until='domcontentloaded',timeout=30000)
                          wrapper = page.locator('.video-embed--ig, .video-embed--reel').first
                          wrapper.scroll_into_view_if_needed()
                          page.wait_for_selector('iframe.instagram-media',timeout=15000)
                          page.wait_for_timeout(2500)
                          record['rendered'] = page.locator('iframe.instagram-media').count()
                          record['frames'] = page.locator('iframe.instagram-media').evaluate_all('els=>els.map(el=>({width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height,src:el.src}))')
                          record['public_frame_content'] = []
                          for frame in page.frames:
                              if 'instagram.com' in frame.url:
                                  try:
                                      record['public_frame_content'].append({'url':frame.url,'text':frame.locator('body').inner_text(timeout=3000)[:800],
                                      'images':frame.locator('img').evaluate_all('els=>els.slice(0,8).map(el=>({naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height,fit:getComputedStyle(el).objectFit}))')})
                                  except Exception as error:
                                      record['public_frame_content'].append({'error':str(error)[:300]})
                          wrapper.screenshot(path=str(out/f'instagram-real-{slug}-{width}.png'),timeout=10000)
                      except Exception as error:
                          record['limitation'] = str(error)[:500]
                      finally:
                          page.remove_listener('response',response_seen)
                          report['cases'].append(record)
                  ctx.close()
              browser.close()
          server.shutdown()
          (out/'instagram-availability.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit validated repair to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_site.py --check
          git diff --exit-code -- llms.txt
          rm .maintenance/repair_video_aspect.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve video preview ratios and let Instagram resize embedded posts'
          git push origin HEAD:refs/heads/repair/video-aspect-20260918
          git rev-parse HEAD | tee .test-results/validated-commit.txt
          echo "Validated repair: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save all validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-video-validation
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
