name: Validate responsive video repair
on:
  push:
    branches: [repair/video-aspect-20260918]
permissions:
  contents: read
concurrency:
  group: video-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair-and-test:
    if: github.ref == 'refs/heads/repair/video-aspect-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/video-aspect-20260918
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned browser dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Record original video geometry and screenshots
        env:
          VIDEO_PHASE: before
        run: python tools/video_layout_check.py
      - name: Apply narrowly scoped, content-preserving repair
        run: |
          python .maintenance/repair_video_aspect.py
          python tools/sync_site.py
          python tools/check_site.py
          git diff --exit-code -- llms.txt
          git diff --no-ext-diff > .test-results/video-repair.diff
      - name: Chromium and WebKit regressions
        shell: bash
        run: |
          set -euo pipefail
          (BROWSER=chromium python tools/video_layout_check.py && BROWSER=chromium python tools/browser_check.py) > .test-results/chromium-validation.log 2>&1 &
          chromium_pid=$!
          (BROWSER=webkit python tools/video_layout_check.py && BROWSER=webkit python tools/browser_check.py) > .test-results/webkit-validation.log 2>&1 &
          webkit_pid=$!
          failed=0
          wait "$chromium_pid" || failed=1
          wait "$webkit_pid" || failed=1
          cat .test-results/chromium-validation.log
          cat .test-results/webkit-validation.log
          exit "$failed"
      - name: Record real Instagram availability separately from layout tests
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          urls = ['https://www.instagram.com/embed.js', 'https://www.instagram.com/p/DLfFQBQTV2W/embed/']
          report = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      report.append({'url':url,'status':response.status,'bytes':len(body),'final_url':response.url})
              except Exception as error:
                  report.append({'url':url,'error':str(error)})
          Path('.test-results/instagram-availability.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit validated repair to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_site.py --check
          git diff --exit-code -- llms.txt
          # One-time machinery is deliberately excluded from the published tree.
          rm .maintenance/repair_video_aspect.py .github/workflows/video-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve video preview ratios and let Instagram resize embedded posts'
          git push origin HEAD:refs/heads/repair/video-aspect-20260918
          git rev-parse HEAD | tee .test-results/validated-commit.txt
          echo "Validated repair: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save all validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-video-validation
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
