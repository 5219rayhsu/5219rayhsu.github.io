name: Production acceptance 6941490
on:
  push:
    branches: [verify/production-6941490-20260916]
permissions:
  contents: read
concurrency:
  group: production-acceptance-6941490
  cancel-in-progress: false
jobs:
  acceptance:
    name: Verify live release 6941490
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6941490fa08174f24dc35fb02339dbd4e27b655b
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install verification dependency
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Verify all published pages and core files using GET
        run: python tools/verify_live.py
      - name: Verify all new thumbnails and record acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          base = 'https://5219rayhsu.github.io/'
          paths = sorted(root.glob('assets/img/medicine/*-320w.webp'))
          assert len(paths) == 78, f'Expected 78 new preview files, found {len(paths)}'

          def check(path):
              rel = path.relative_to(root).as_posix()
              expected = hashlib.sha256(path.read_bytes()).hexdigest()
              error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + rel, headers={'Cache-Control': 'no-cache', 'User-Agent': 'PortfolioProductionAcceptance/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data = response.read()
                          actual = hashlib.sha256(data).hexdigest()
                          if response.status == 200 and actual == expected:
                              return {'path': rel, 'status': 200, 'matches': True, 'sha256': actual, 'bytes': len(data)}
                          error = f'HTTP {response.status}; digest match: {actual == expected}'
                  except OSError as exc:
                      error = str(exc)
                  if attempt < 2:
                      time.sleep(3)
              return {'path': rel, 'matches': False, 'error': error}

          with ThreadPoolExecutor(max_workers=4) as pool:
              previews = list(pool.map(check, paths))
          out = root / '.test-results'
          live = json.loads((out / 'live.json').read_text())
          passed = live['passed'] and len(live['checks']) == 41 and all(item['matches'] for item in previews)
          report = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'verified_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'production_url': base,
              'page_and_core_checks': len(live['checks']),
              'page_and_core_matches': sum(item['matches'] for item in live['checks']),
              'preview_checks': len(previews),
              'preview_matches': sum(item['matches'] for item in previews),
              'legacy_urls': live['legacy_urls'],
              'missing_page_status': live['missing_page_status'],
              'llms_sha256': hashlib.sha256((root / 'llms.txt').read_bytes()).hexdigest(),
              'previews': previews,
              'passed': passed
          }
          (out / 'production-acceptance.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({key: value for key, value in report.items() if key != 'previews'}, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Production acceptance\nRelease: `{report['source_commit']}`\n\nPages and core files: {report['page_and_core_matches']}/41. New previews: {report['preview_matches']}/78. Missing page: {report['missing_page_status']}. Passed: {passed}.\n")
          raise SystemExit(not passed)
          PY
      - name: Preserve dated production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-acceptance-6941490
          path: .test-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
